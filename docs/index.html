<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="정보보안기사 필기 대비 내용을 PART와 SECTION별로 정리하는 개인 학습용 전자 요약노트">
  <title>정보보안기사 필기 대비</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#mainContent">본문으로 바로가기</a>

  <header class="topbar">
    <button class="icon-button menu-button" id="menuButton" type="button" aria-label="목차 열기" aria-expanded="false" aria-controls="sidebar">
      <span aria-hidden="true">☰</span>
    </button>

    <button class="brand" id="homeButton" type="button" aria-label="홈 화면으로 이동">
      <span class="brand-mark" aria-hidden="true">S</span>
      <span>정보보안기사 필기 대비</span>
    </button>

    <div class="study-mode-controls">
      <nav class="primary-tabs" aria-label="주요 화면" role="tablist">
        <button class="primary-tab is-active" id="summaryTab" type="button" role="tab" aria-selected="true" aria-controls="mainContent" data-primary-tab="summary">요약</button>
        <button class="primary-tab" id="questionsTab" type="button" role="tab" aria-selected="false" aria-controls="mainContent" data-primary-tab="questions">문제</button>
      </nav>

      <div class="difficulty-tabs" id="difficultyTabs" aria-label="문제 난이도" hidden>
        <button class="difficulty-tab is-active" id="normalDifficultyButton" type="button" aria-pressed="true" data-question-difficulty="normal">보통</button>
        <button class="difficulty-tab" id="hardDifficultyButton" type="button" aria-pressed="false" data-question-difficulty="hard">어려움</button>
      </div>
    </div>

    <div class="search-area" id="searchArea">
      <label class="visually-hidden" for="globalSearch">전체 내용 검색</label>
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="globalSearch" type="search" placeholder="PART, SECTION, 본문 검색" autocomplete="off" aria-controls="searchResults" aria-expanded="false">
      <div class="search-results" id="searchResults" role="listbox" aria-label="검색 결과" hidden></div>
    </div>

    <button class="theme-button" id="themeButton" type="button" aria-label="어두운 모드로 전환">
      <span class="theme-icon" aria-hidden="true">☾</span>
      <span class="theme-label">어두운 모드</span>
    </button>
  </header>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="PART 및 SECTION 목차">
      <div class="sidebar-heading">
        <p id="sidebarHeadingLabel">CONTENTS</p>
        <div class="sidebar-heading-title-row">
          <h2 id="sidebarHeadingTitle">필기 전체 목차</h2>
          <button class="question-all-reset" id="questionAllReset" type="button" hidden>전체 초기화</button>
        </div>
      </div>
      <nav id="studyNavigation" aria-label="학습 목차"></nav>
    </aside>

    <button class="menu-backdrop" id="menuBackdrop" type="button" aria-label="목차 닫기" tabindex="-1" hidden></button>

    <main class="content-scroller" id="mainContent" tabindex="-1">
      <div class="content-container" id="contentContainer" aria-live="polite"></div>
    </main>
  </div>

  <button class="to-top-button" id="toTopButton" type="button" aria-label="본문 맨 위로 이동" hidden>
    <span aria-hidden="true">↑</span>
  </button>

  <div class="modal-overlay" id="updateModal" role="presentation" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="updateModalTitle" tabindex="-1">
      <header class="modal-header">
        <div>
          <p class="eyebrow">CHANGELOG</p>
          <h2 id="updateModalTitle">업데이트 로그</h2>
        </div>
        <button class="modal-close" id="modalCloseButton" type="button" aria-label="업데이트 로그 닫기">×</button>
      </header>
      <div class="modal-body" id="updateLogContent"></div>
    </section>
  </div>

  <script src="js/data.js"></script>
  <script src="js/updates.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/questions-extra.js"></script>
  <script src="js/questions-batch-230919.js"></script>
  <script src="js/questions-batch-235617.js"></script>
  <script src="js/questions-batch-082156.js"></script>
  <script src="js/questions-batch-082314.js"></script>
  <script src="js/questions-batch-083307.js"></script>
  <script src="js/questions-batch-083449.js"></script>
  <script src="js/questions-batch-222214.js"></script>
  <script src="js/questions-batch-081823.js"></script>
  <script src="js/questions-batch-082432.js"></script>
  <script src="js/questions-batch-082555.js"></script>
  <script src="js/questions-batch-082727.js"></script>
  <script src="js/questions-batch-175341.js"></script>
  <script src="js/questions-batch-181440.js"></script>
  <script src="js/questions-batch-183737.js"></script>
  <script src="js/questions-batch-185552.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
